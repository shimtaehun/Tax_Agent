[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-copilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert in tests
    "B008",  # FastAPI Depends() in function defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "langgraph.*",
    "qdrant_client.*",
    "alembic.*",
    "jose.*",
    "passlib.*",
    "structlog.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tax_copilot.core.auth"]
# passlib/jose have no stubs; their return types are Any
disallow_any_expr = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
